org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

# Interpreters whose headers the `jextract` tasks generate bindings from, one
# per Python version that has bindings; each task checks it gets exactly that
# version. Which libpython is used at runtime is chosen separately, when the
# program starts (see README).
jextract.python312=python3.12
jextract.python313=python3.13
jextract.python314=python3.14
jextract.python315=python3.15
